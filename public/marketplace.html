<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find food near you — FoodSave AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<div id="site-header"></div>
<main class="container"><div class="page-head"><h1 style="font-size:2.4rem">Food near you</h1>
  <p class="muted">Discounted surplus food from local businesses. Reserve now, collect before the deadline.</p></div>
  <div class="market">
    <aside class="card filters stack" aria-label="Filters">
      <div><label for="search">Search</label><input id="search" placeholder="biryani, bread…"></div>
      <div><label for="radius">Distance: <span id="rv">10</span> km</label><input id="radius" type="range" min="1" max="30" value="10"></div>
      <div><label for="cat">Category</label><select id="cat"><option value="all">All categories</option></select></div>
      <div><label for="price">Max price: <span id="pv">Any</span></label><input id="price" type="range" min="0" max="1000" step="50" value="1000"></div>
      <div><label for="within">Collect within</label><select id="within"><option value="">Any time</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="360">6 hours</option></select></div>
      <div><label for="sort">Sort by</label><select id="sort"><option value="distance">Nearest</option><option value="ending">Ending soonest</option><option value="price">Lowest price</option></select></div>
      <button class="btn outline sm" id="geo">📍 Use my location</button>
    </aside>
    <section><div class="grid cols-3" id="list"></div></section>
  </div></main>
<div id="site-footer"></div>
<script src="/js/app.js"></script><script src="/js/marketplace.js"></script></body></html>
